<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080808" />

    <title>S7 Labs — Digital Experiences That Move Businesses Forward</title>
    <meta
      name="description"
      content="S7 Labs designs and develops premium websites, digital experiences and brand identities for modern businesses."
    />
    <link rel="canonical" href="%SITE_URL%/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#E50914" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="S7 Labs" />
    <meta property="og:title" content="S7 Labs — Digital Experiences That Move Businesses Forward" />
    <meta
      property="og:description"
      content="S7 Labs designs and develops premium websites, digital experiences and brand identities for modern businesses."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="S7 Labs — Think. Build. Evolve." />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="S7 Labs — Digital Experiences That Move Businesses Forward" />
    <meta
      name="twitter:description"
      content="S7 Labs designs and develops premium websites, digital experiences and brand identities for modern businesses."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <!-- Fonts: Space Grotesk (display) + Inter (UI/body).
         Loaded non-blocking: fetched as a preload, then promoted to a real
         stylesheet on load. A plain <link rel="stylesheet"> here blocks first
         paint on a third-party round trip. The hero's entrance waits on
         document.fonts.ready, so the headline still never reveals in the
         fallback face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "S7 Labs",
        "slogan": "Think. Build. Evolve.",
        "description": "S7 Labs designs and develops premium websites, digital experiences and brand identities for modern businesses.",
        "url": "%SITE_URL%/",
        "email": "%SITE_EMAIL%",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Raipur",
          "addressRegion": "Chhattisgarh",
          "addressCountry": "IN"
        },
        "areaServed": "Worldwide",
        "knowsAbout": [
          "Web Design",
          "Web Development",
          "UI/UX Design",
          "E-Commerce",
          "Branding",
          "Logo Design",
          "Website Maintenance"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify Forms registration.

      Netlify's build bots read the deployed HTML to learn which forms exist;
      they never see the React tree, which is assembled in the browser long
      after the deploy. So the real form declares itself here, statically, and
      the interactive one in EnquiryForm.jsx posts to this name.

      Every field the client sends must be listed, or Netlify discards the ones
      it was not told about. Keep this in sync with EMPTY in EnquiryForm.jsx.

      Sits outside #root so React never touches it, and `hidden` keeps it out
      of the page, the tab order and the accessibility tree.
    -->
    <form name="enquiry" data-netlify="true" netlify-honeypot="company_website" hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
      <input type="text" name="budget" />
      <textarea name="details"></textarea>
      <input type="text" name="subject" />
      <input type="text" name="submittedAt" />
      <input type="text" name="source" />
      <input type="text" name="company_website" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
