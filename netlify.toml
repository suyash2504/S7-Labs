[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Matches the Node the build is actually tested on locally. Vite 8 needs
  # ^20.19 || >=22.12, so "22" would also work, but pinning to the tested
  # major avoids surprises when Netlify moves its default.
  NODE_VERSION = "24"
  # playwright and lighthouse are devDependencies used only by local scripts.
  # Current playwright has no postinstall, but this keeps a future version from
  # pulling ~150MB of browsers into every deploy.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# SPA fallback — every route is served by index.html and resolved client-side.
# (public/_redirects does the same; this file wins if both are present.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Hashed filenames — safe to cache forever.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
